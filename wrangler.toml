name = "versys"
main = "src/index.js"
compatibility_date = "2026-09-04"

routes = [
  { pattern = "versys.ekat.ca", custom_domain = true }
]

[[d1_databases]]
binding = "DB"
database_name = "versys"
database_id = "55e3248e-2b38-438d-8f22-c6e14a8c1183"

# R2 not yet enabled on the Cloudflare account - add once available:
# [[r2_buckets]]
# binding = "BUCKET"
# bucket_name = "versys"

# D1 schema lives in ./migrations — apply with:
#   npx wrangler d1 migrations apply versys --remote
# (wrangler reads migrations_dir from the d1_databases block; default is ./migrations)

# --- Field ticket e-sign automation (non-secret settings) -------------------
# Uncomment and fill in once the Acumatica custom endpoint exists.
# Secrets (passwords, tokens) go in `wrangler secret put`, NOT here.
# See docs/automation/field-ticket-esign.md.
# [vars]
# ACUMATICA_BASE_URL = "https://versys.acumatica.com"
# ACUMATICA_TENANT = "Versys US"
# ACUMATICA_ENDPOINT_NAME = "VersysExt"
# ACUMATICA_ENDPOINT_VERSION = "24.200.001"
# ACUMATICA_FT_ENTITY = "FieldTicket"
# ACUMATICA_FT_KEY_FIELD = "RefNbr"
# ACUMATICA_FT_SENT_DATE_FIELD = "CustomerSentDate"
# ACUMATICA_REPORT_ENTITY = "FieldTicketUnpricedWeekly"
# ACUMATICA_REPORT_PARAM = "RefNbr"
# ADOBE_SIGN_SENDER_EMAIL = "office@versys.example"
